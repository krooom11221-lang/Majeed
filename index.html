<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيقات جمعية مجيد</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مجيد">
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--sub:#6e6e73}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--sub:#98989d}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 48px) 20px 24px}
h1{font-size:30px;margin:0 0 6px}p{color:var(--sub);margin:0 0 28px}
a{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--tx);text-decoration:none;padding:18px;border-radius:16px;margin-bottom:12px;font-size:18px;font-weight:600}
a span{font-size:28px}
</style>
</head>
<body>
<h1>جمعية مجيد</h1>
<p>اختر التطبيق</p>
<a href="majeed%20vouchers%20ios%201.html" data-alt="majeed_vouchers_ios_1.html|vouchers.html"><span>🧾</span>السندات المالية</a>
<a href="majeed%20contract%20ios.html" data-alt="majeed_contract_ios.html|contract.html"><span>📄</span>عقود العمل</a>
<script>
document.querySelectorAll('a[data-alt]').forEach(async a=>{
  for(const u of [a.getAttribute('href'),...a.dataset.alt.split('|')]){
    try{const r=await fetch(u,{method:'HEAD'});if(r.ok){a.href=u;return}}catch(e){}
  }
});
</script>
</body>
</html>
